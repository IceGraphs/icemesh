# This YAML file defines the data locations and preprocessing settings used to convert WAVI trajectories into NetCDF graph datasets.

# Filesystem locations
data:
  # Base directory used for all relative paths below
  root_dir: C:/storage/IceGraph

  # Directory containing the raw WAVI test trajectories
  wavi_trajectories_subdir: WAVI_simulations/8km_simulations/training_datasets/trajectories

  # Directory containing WAVI checkpoint files
  wavi_checkpoints_subdir: WAVI_simulations/8km_simulations/training_datasets/checkpoints

  # Directory where processed trajectories are saved
  mesh_subdir: preprocessed_datasets

  # Directory containing the reference processed datasets
  mesh_gt_subdir: preprocessed_datasets

# Preprocessing settings
model:
  # Time interval between consecutive WAVI snapshots
  delta_time: 1.0

  # Previous input timesteps included in addition to the current timestep
  # A value of 1 produces input timesteps [t-1, t]
  history_size: 2

  # Future states and forcing timesteps stored for rollout training
  # A value of 2 stores timesteps [t+1, t+2]
  future_size: 10


  # Add physical node-type encodings and the reconstructed mesh boundary
  use_node_types: true

  # Number of mutually exclusive physical node types
  # The mesh boundary remains a separate binary feature
  num_node_types: 3

  # Integer identifiers used to construct physical one-hot encodings
  node_type_interior: 0
  node_type_free_slip: 1
  node_type_left_no_slip: 2

  # Complete-feature indices retained in model input x
  # Their listed order determines their order in x
  # Indices 29 to 32 are removed automatically when use_node_types is false
  selected_features_x:
    - 0   # Horizontal velocity u
    - 1   # Horizontal velocity v
    - 6   # Ice thickness h
    - 7   # Bed elevation
    - 8   # Surface elevation
    - 10  # Surface accumulation
    - 11  # Basal melt
    - 16  # Height above flotation
    - 29  # Interior-node encoding
    - 30  # Free-slip encoding
    - 31  # Left no-slip encoding
    - 32  # Reconstructed mesh-boundary encoding


  # Remove a node from every timestep when it reaches this exact thickness
  minimum_thickness: 50.0

  # Maximum accepted triangle-edge length relative to original mesh spacing
  # A value of 1.5 allows edges up to 1.5 times the estimated spacing
  delaunay_edge_factor: 1.5

  # Prefix added to generated NetCDF filenames
  file_prefix: 8km


  # Unit labels stored as NetCDF metadata
  coordinate_units: m
  time_units: years

  # Replace existing trajectory files when true, otherwise skip them
  overwrite: false